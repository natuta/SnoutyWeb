{% extends "base.html" %}

{% block content %}
<div style="max-width:400px;margin:auto;padding:20px;border:1px solid #ccc;border-radius:8px;">
    <h2 style="text-align:center;">Iniciar sesión</h2>

    {% if form.errors %}
        <p style="color:red;">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" style="width:100%;padding:10px;">Ingresar</button>
    </form>

    <p style="text-align:center;margin-top:10px;">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
    </p>
</div>
{% endblock %}
