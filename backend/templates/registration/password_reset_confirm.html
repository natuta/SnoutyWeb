{% extends "base.html" %}

{% block content %}
<h2>Nueva contraseña</h2>

{% if validlink %}
    <p>Ingresa tu nueva contraseña dos veces:</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Guardar nueva contraseña</button>
    </form>
{% else %}
    <p style="color:red;">El enlace ya no es válido o ha expirado.</p>
    <p>
        <a href="{% url 'password_reset' %}">Solicitar uno nuevo</a>
    </p>
{% endif %}
{% endblock %}
