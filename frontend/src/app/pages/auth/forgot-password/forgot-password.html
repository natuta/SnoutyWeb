<!-- RECUPERAR CONTRASEÑA – CENTRADO PERFECTO -->
<div
  class="surface-ground"
  style="
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;

    background-image: url('https://www.housedigest.com/img/gallery/12-ways-to-use-lemon-around-your-backyard-and-garden/to-repel-cats-and-dogs-from-the-garden-1714769409.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  "
>
  <!-- CARD -->
  <div
    style="
      width: 100%;
      max-width: 420px;
      margin: auto;

      padding: 2rem;
      border-radius: 18px;

      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      text-align: center;
    "
  >
    <!-- ICONO -->
    <div
      style="
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem auto;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.25);
      "
    >
      <i class="pi pi-key text-xl" style="color:#ffffff;"></i>
    </div>

    <!-- TITULOS -->
    <h2 style="color:#ffffff; font-size:1.5rem; font-weight:700; margin:0;">
      Recuperar contraseña
    </h2>

    <p style="color:rgba(255,255,255,0.85); font-size:0.875rem; margin:0.75rem 0 1.5rem;">
      Ingresa tu correo y abriremos el formulario de recuperación de Django para que completes el proceso.
    </p>

    <!-- FORM -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Email -->
      <div style="margin-bottom:1rem; text-align:left;">
        <label style="color:#ffffff; font-size:0.875rem; font-weight:500;">
          Correo electrónico
        </label>

        <input
          type="email"
          pInputText
          class="w-full"
          formControlName="email"
          placeholder="tucorreo@ejemplo.com"
          style="
            margin-top:0.25rem;
            background: rgba(255,255,255,0.9);
          "
        />

        <small class="p-error block" *ngIf="f['email'].touched && f['email'].invalid">
          Ingresa un correo válido.
        </small>
      </div>

      <!-- ERRORES / MENSAJES -->
      <div *ngIf="error" class="p-error text-sm mb-2">
        {{ error }}
      </div>

      <div *ngIf="message" style="color:#b6ffb6; font-size:0.875rem; margin-bottom:0.5rem;">
        {{ message }}
      </div>

      <!-- BOTON -->
      <button
        pButton
        type="submit"
        [label]="loading ? 'Abriendo...' : 'Abrir recuperación'"
        class="w-full"
        [disabled]="loading || form.invalid"
      ></button>
    </form>

    <!-- LINKS -->
    <div style="margin-top:1rem; font-size:0.75rem;">
      <a
        [href]="passwordResetUrl"
        target="_blank"
        rel="noopener noreferrer"
        style="color:rgba(255,255,255,0.85); display:block; margin-bottom:0.5rem;"
      >
        Abrir recuperación (Django)
      </a>

      <a
        (click)="goToLogin()"
        class="cursor-pointer"
        style="color:#ffd86b;"
      >
        Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>
